packages:
  - packages/*
  - docs
  - examples/*/*

# The comark-docs layer pins nuxt-llms to a pkg.pr.new edge build (URL-resolved
# subdependency), which pnpm blocks by default. Delete this line once nuxt-llms
# ships a registry release the layer can depend on instead.
blockExoticSubdeps: false

allowBuilds:
  "@parcel/watcher": false
  better-sqlite3: true
  comark-docs: false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  sharp: false
  vue-demi: false

catalog:
  # AI
  "@ai-sdk/gateway": ^4.0.90
  "@ai-sdk/vue": ^4.0.112
  "@astrojs/react": ^6.0.6
  "@clack/prompts": ^1.8.1
  "@comark/html": ^0.7.0
  "@comark/nuxt": ^0.7.0
  "@comark/react": ^0.7.0
  "@comark/vue": ^0.7.0

  # Misc
  "@json-render/core": ^0.21.0
  "@monaco-editor/loader": ^1.7.0
  "@nuxt/devtools-kit": 4.0.0-beta.1
  # Keep kit on the same minor line as `nuxt` so `@nuxt/schema` stays singular
  # (dual schema breaks `defineNuxtModule` setup typing + declaration emit).
  "@nuxt/kit": 4.5.2
  "@nuxt/ui": ^4.11.2
  "satori": ^0.33.5
  "@resvg/resvg-js": ^2.6.2
  "@nuxtjs/mcp-toolkit": 0.21.0
