name: codspeed

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Lets CodSpeed trigger backtest runs to build the initial history.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC authentication with CodSpeed, no token secret needed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: '24.21.0'
      - run: npm i -g --force corepack && corepack enable
      # `postinstall` stubs every package `dist/` to its sources, so the
      # benches measure the checked-out code without a build step.
      - run: pnpm install
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: pnpm bench
